<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071723" />
    <title>سوقي — لا يوجد اتصال</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f6f4;color:#183741;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}.card{max-width:440px;width:100%;border:1px solid #d9e6e0;border-radius:24px;background:#fff;padding:28px;text-align:center;box-shadow:0 18px 50px #17364518}.icon{width:56px;height:56px;margin:0 auto 16px;display:grid;place-items:center;border-radius:18px;background:#e8f6f1;color:#0f6e58;font-size:24px}h1{font-size:22px;margin:0 0 10px}p{font-size:14px;line-height:1.9;color:#6f8586;margin:0 0 18px}button{border:0;border-radius:12px;background:#0f5d4d;color:white;font-size:14px;font-weight:700;padding:12px 20px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">↻</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر تحميل التطبيق من هذا الجهاز. افحص اتصال الشبكة ثم أعد المحاولة. لا تحفظ الفواتير دون ظهور تأكيد الحفظ من الخادم.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
